name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Formatting
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.36.0
          test -z "$(gofmt -l .)"
          test -z "$(goimports -local github.com/toprakgureli/sizinti -l .)"
